{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block title %}{{ page.title }} | Миколаївський ліцей №9{% endblock %}

{% block content %}
<!-- Hero Section -->
<section class="page-hero page-hero-sm">
    <div class="hero-bg-pattern"></div>
    <div class="container">
        <div class="hero-content text-center">
            <h1 class="hero-title">{{ page.title }}</h1>
        </div>
    </div>
</section>



<section class="standard-content-section" style="background: var(--gray-50); padding: 3.5rem 0 5.5rem; min-height: 60vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <article class="content-article" style="background: var(--white); border-radius: 20px; padding: clamp(2rem, 4vw, 3.5rem); border: 1px solid var(--gray-200); box-shadow: var(--shadow-sm);">
                    <div class="article-content" style="line-height: 1.85; font-size: 1.05rem; color: var(--gray-700);">
                        {{ page.body|richtext }}
                    </div>
                </article>
            </div>
        </div>
    </div>
</section>
{% endblock %}
